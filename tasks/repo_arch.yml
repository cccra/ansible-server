---
# Resolve the Debian/Ubuntu architecture string used in apt repository definitions.
# Included by any role that adds an apt repo.
- name: Set the apt repository architecture
  ansible.builtin.set_fact:
    repo_arch: >-
      {{
        {
          'x86_64': 'amd64',
          'aarch64': 'arm64',
          'arm64': 'arm64',
          'armv7l': 'armhf'
        }.get(ansible_facts['architecture'], ansible_facts['architecture'])
      }}
