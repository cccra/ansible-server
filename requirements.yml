---
# ansible-galaxy install -r requirements.yml -- installs both the roles and the
# collections below.

collections:
  # docker_container, docker_network
  - name: community.docker
    version: ">=4.0.0,<6.0.0"
  # locale_gen, snap, alternatives
  - name: community.general
  # mount, synchronize, sysctl
  - name: ansible.posix

roles:
  - name: bertvv.samba
  - name: geerlingguy.security
  - name: geerlingguy.ntp
  - name: chriswayg.msmtp-mailer
  - name: stuvusit.smartd
  - name: oefenweb.dns
  - name: notthebee.ubuntu_autoinstall
  - name: ironicbadger.snapraid
