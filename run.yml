---
#
# Tasks and roles for all hosts
#
- name: Probe the SSH port before configuring anything
  hosts: all
  gather_facts: false

  pre_tasks:
    - name: Determine which SSH port and credentials work
      ansible.builtin.import_tasks: tasks/ssh_juggle_port.yml
      tags:
        - port

- name: Configure the NAS host and its services
  hosts: all
  become: true

  roles:
    #
    # Basics
    #
    - role: system
      tags:
        - system

    - role: neovim
      tags:
        - neovim

    - role: geerlingguy.security
      tags:
        - security

    #
    # Filesystems
    #
    - role: filesystems/mergerfs
      become: true
      tags:
        - mergerfs
      when: enable_nas_stuff | default(false)

    - role: filesystems/mounts
      become: true
      tags:
        - mounts
      when: enable_nas_stuff | default(false)

    - role: docker
      tags:
        - docker

    # Host-side GPU setup (driver + container toolkit). Required by every service
    # that requests the NVIDIA runtime via `device_requests`, not just Jellyfin.
    - role: nvidia
      become: true
      tags:
        - nvidia
      when: >-
        enable_nvidia | default(
          enable_jellyfin | default(false)
          or enable_immich | default(false)
          or enable_tdarr | default(false)
          or enable_openreader | default(false)
        )

    - role: chriswayg.msmtp-mailer
      tags:
        - msmtp

    - role: oefenweb.dns
      tags:
        - dns

    - role: geerlingguy.ntp
      tags:
        - ntp

    #
    # Security
    #
    - role: security/fail2ban
      tags:
        - fail2ban
      when: enable_fail2ban | default(false)

    - role: security/iptables
      tags:
        - iptables
      when: enable_iptables | default(false)

    - role: security/crowdsec
      tags:
        - crowdsec
      when: enable_crowdsec | default(false)

    - role: network/nginx-proxy-manager
      become: false
      tags:
        - nginx-proxy-manager
        - containers
      when: enable_nginxproxymanager | default(false)

    - role: network/cloudflare-ddns
      become: false
      tags:
        - cloudflare-ddns
        - containers
      when: enable_cloudflare_ddns | default(false)

    - role: containers/adguard
      become: false
      tags:
        - adguard
        - containers
      when: enable_adguard | default(false)

    #
    # NAS / storage
    #
    - role: filesystems/hd-idle
      become: true
      tags:
        - hd-idle
      when: enable_nas_stuff | default(false)

    - role: stuvusit.smartd
      become: true
      tags:
        - smartd
      when: enable_nas_stuff | default(false)

    - role: ironicbadger.snapraid
      become: true
      tags:
        - snapraid
      when: enable_nas_stuff | default(false)

    #
    # Dashboard
    #
    - role: containers/homarr
      become: false
      tags:
        - homarr
        - containers
      when: enable_homarr | default(false)

    #
    # System
    #
    - role: containers/prowlarr
      become: false
      tags:
        - prowlarr
        - containers
      when: enable_prowlarr | default(false)

    - role: containers/flaresolverr
      become: false
      tags:
        - flaresolverr
        - containers
      when: enable_flaresolverr | default(false)

    - role: containers/unpackerr
      become: false
      tags:
        - unpackerr
        - containers
      when: enable_unpackerr | default(false)

    - role: containers/bazarr
      become: false
      tags:
        - bazarr
        - containers
      when: enable_bazarr | default(false)

    - role: containers/tdarr
      become: false
      tags:
        - tdarr
        - containers
      when: enable_tdarr | default(false)

    - role: containers/watchtower
      become: false
      tags:
        - watchtower
        - containers
      when: enable_watchtower | default(false)

    - role: containers/dashdot
      become: false
      tags:
        - dashdot
        - containers
      when: enable_dashdot | default(false)

    #
    # Media
    #
    - role: containers/qbittorrent
      become: false
      tags:
        - qbittorrent
        - containers
      when: enable_qbittorrent | default(false)

    - role: containers/sonarr
      become: false
      tags:
        - sonarr
        - containers
      when: enable_sonarr | default(false)

    - role: containers/radarr
      become: false
      tags:
        - radarr
        - containers
      when: enable_radarr | default(false)

    - role: containers/lazylibrarian
      become: false
      tags:
        - lazylibrarian
        - containers
      when: enable_lazylibrarian | default(false)

    - role: containers/lidarr
      become: false
      tags:
        - lidarr
        - containers
      when: enable_lidarr | default(false)

    - role: containers/jellyfin
      become: false
      tags:
        - jellyfin
        - containers
      when: enable_jellyfin | default(false)

    - role: containers/wizarr
      become: false
      tags:
        - wizarr
        - containers
      when: enable_wizarr | default(false)

    - role: containers/navidrome
      become: false
      tags:
        - navidrome
        - containers
      when: enable_navidrome | default(false)

    - role: containers/audiobookshelf
      become: false
      tags:
        - audiobookshelf
        - containers
      when: enable_audiobookshelf | default(false)

    - role: containers/jellyseerr
      become: false
      tags:
        - jellyseerr
        - containers
      when: enable_jellyseerr | default(false)

    #
    # Services
    #
    - role: containers/photoprism
      become: false
      tags:
        - photoprism
        - containers
      when: enable_photoprism | default(false)

    - role: containers/immich
      become: false
      tags:
        - immich
        - containers
      when: enable_immich | default(false)

    - role: containers/gitea
      become: false
      tags:
        - gitea
        - containers
      when: enable_gitea | default(false)

    - role: containers/grocy
      become: false
      tags:
        - grocy
        - containers
      when: enable_grocy | default(false)

    - role: containers/tandoor
      become: false
      tags:
        - tandoor
        - containers
      when: enable_tandoor | default(false)

    - role: containers/linkding
      become: false
      tags:
        - linkding
        - containers
      when: enable_linkding | default(false)

    - role: containers/wallabag
      become: false
      tags:
        - wallabag
        - containers
      when: enable_wallabag | default(false)

    - role: containers/openreader
      become: false
      tags:
        - openreader
        - containers
      when: enable_openreader | default(false)

    - role: containers/invoiceninja
      become: false
      tags:
        - invoiceninja
        - containers
      when: enable_invoiceninja | default(false)

    - role: containers/paperless
      become: false
      tags:
        - paperless
        - containers
      when: enable_paperless | default(false)

    - role: containers/nextcloud
      become: false
      tags:
        - nextcloud
        - containers
      when: enable_nextcloud | default(false)

    - role: containers/vaultwarden
      become: false
      tags:
        - vaultwarden
        - containers
      when: enable_vaultwarden | default(false)

    - role: containers/gramps
      become: false
      tags:
        - gramps
        - containers
      when: enable_gramps | default(false)

    - role: containers/wireguard
      become: false
      tags:
        - wireguard
        - containers
      when: enable_wireguard | default(false)

# Samba is disabled. To enable it, uncomment the role block below and set
# enable_samba: true in your group_vars.
#
#     - role: bertvv.samba
#       become: true
#       tags:
#         - samba
#       when: enable_samba | default(false)
