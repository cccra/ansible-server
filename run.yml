---
#
# Tasks and roles for all hosts
#
- name: Probe the SSH port before configuring anything
  hosts: all
  gather_facts: false

  pre_tasks:
    # `always` so tagged runs (--tags containers, --tags snapraid, ...) don't have to
    # remember to include the probe -- everything after it depends on the connection
    # details it discovers.
    - name: Determine which SSH port and credentials work
      ansible.builtin.import_tasks: tasks/ssh_juggle_port.yml
      tags:
        - port
        - always

- name: Configure the NAS host and its services
  hosts: all
  become: true

  roles:
    #
    # Basics
    #
    - role: system
      tags:
        - system

    - role: neovim
      tags:
        - neovim

    - role: geerlingguy.security
      tags:
        - security

    #
    # Filesystems
    #
    - role: filesystems/mergerfs
      become: true
      tags:
        - mergerfs
      when: enable_nas_stuff | default(false)

    - role: filesystems/mounts
      become: true
      tags:
        - mounts
      when: enable_nas_stuff | default(false)

    - role: docker
      tags:
        - docker

    # Fleet reconciliation: the container networks, teardown of disabled services,
    # persistent data. Tagged `containers` so a containers-only run still reconciles
    # the fleet against the enable_container_* flags before the services deploy.
    - role: container-fleet
      tags:
        - container-fleet
        - containers

    # Host-side GPU setup (driver + container toolkit). Required by every service
    # that requests the NVIDIA runtime via `device_requests`, not just Jellyfin.
    - role: nvidia
      become: true
      tags:
        - nvidia
      when: >-
        enable_nvidia | default(
          enable_container_jellyfin | default(false)
          or enable_container_immich | default(false)
          or enable_container_tdarr | default(false)
          or enable_container_openreader | default(false)
        )

    - role: chriswayg.msmtp-mailer
      tags:
        - msmtp

    - role: oefenweb.dns
      tags:
        - dns

    - role: geerlingguy.ntp
      tags:
        - ntp

    #
    # Security
    #
    - role: security/fail2ban
      tags:
        - fail2ban
      when: enable_fail2ban | default(false)

    - role: security/iptables
      tags:
        - iptables
      when: enable_iptables | default(false)

    - role: security/crowdsec
      tags:
        - crowdsec
      when: enable_crowdsec | default(false)

    #
    # NAS / storage
    #
    - role: filesystems/hd-idle
      become: true
      tags:
        - hd-idle
      when: enable_nas_stuff | default(false)

    - role: stuvusit.smartd
      become: true
      tags:
        - smartd
      when: enable_nas_stuff | default(false)

    # Deploys /usr/local/bin/snapraid-backup.sh, which the snapraid role's cron entry
    # invokes. Has to come first so the script exists before the cron references it.
    - role: filesystems/snapraid-backup
      become: true
      tags:
        - snapraid-backup
        - snapraid
      when: enable_nas_stuff | default(false)

    - role: ironicbadger.snapraid
      become: true
      tags:
        - snapraid
      when: enable_nas_stuff | default(false)

    #
    # Containers
    #
    # Every service under services/ is deployed by this one role, driven by the
    # enable_container_* flags. Tags cannot select an item inside a loop, so a single
    # service is deployed with -e service_filter=<name> rather than --tags <name>.
    - role: container
      become: false
      tags:
        - containers

# Samba is disabled. To enable it, uncomment the role block below and set
# enable_samba: true in your group_vars.
#
#     - role: bertvv.samba
#       become: true
#       tags:
#         - samba
#       when: enable_samba | default(false)
