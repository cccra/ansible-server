# Do not edit this file directly
# Instead, add your customizations to group_vars/your-inventory-name/vars.yml
# For secret variables, use group_vars/your-inventory-name/vault.yml

# Networks

# the ip address range for your home network
lan_network: "192.168.1.0/24"

# The ip address of your server (just put the last part of the ip at the end)
lan_address: "{{ '.'.join(lan_network.split('.')[0:3]) }}.136"

# The ip for adguard, used internally for dns resolution
adguard_address: "11.0.0.2"

# Miscellaneous settings
hostname: "{{ inventory_hostname }}"

timezone: Europe/London

ntp_timezone: "{{ timezone }}"

locale: en_US.UTF-8

dns_nameservers: ["{{ adguard_address }}", "1.1.1.1", "1.0.0.1"]

keyboard_layout: uk

username: gus

guid: "1000"

shell: /usr/bin/zsh

docker_dir: /opt/docker/data

docker_data_repair_permissions: false

docker_log_max_size: "10m"
docker_log_max_file: "3"

dotfiles_repo: https://gitlab.com/cccra/dotfiles.git

boot_drive_serial: ""

spindown_time: 600 # in seconds

# Packages
extra_packages:
  - mediainfo
  - fd-find
  - fzf
  - zsh
  - iperf3
  - speedtest-cli
  - htop
  - stow
  - git
  - neofetch
  - tmux
  - rsync
  - lm-sensors
  - iotop
  - ncdu
  - rar
  - p7zip
  - p7zip-full

# Container networks -- see the README for how the zones are laid out and how
# nginx-proxy-manager's membership is derived.
#
# app_network is the only one with a pinned subnet, matching what Docker had already
# assigned it: changing it recreates the network and detaches every container on it.
# The rest take whatever Docker's default pool hands out, since pinning a subnet only
# risks colliding with an address space already handed to an auto-assigned network.
app_network_subnet: "172.18.0.0/16"

network_subnets:
  app_network: "{{ app_network_subnet }}"

# Watchtower owns routine updates. Override with -e container_pull=always to make a
# playbook run pull new images as well.
container_pull: missing

# Datastores are held at a release line rather than a floating tag, so Watchtower
# delivers patches but never a major upgrade -- which for these means an on-disk format
# change the container cannot perform unattended. Moving up a line is a deliberate edit.
mariadb_image: "mariadb:12.3"

mysql_image: "mysql:8.4"

redis_image: "redis:8-alpine"

# Six fields, leading one is seconds.
watchtower_schedule: "0 0 5 * * *"

# How long a container gets after SIGTERM before Watchtower kills it. The 30s default is
# short for a database flushing a large buffer pool to spinning disks, and a kill there
# means crash recovery on next start rather than a clean shutdown.
watchtower_stop_timeout: 2m

# Apt mirrors

apt_mirror: http://ubuntu.mirrors.uk2.net/ubuntu

# Suite comes from facts so it cannot drift from the installed release.
apt_suite: "{{ ansible_facts['distribution_release'] }}"

# Email credentials (for SMART and Snapraid error reporting)

email: you@example.com
email_login: "{{ email }}"
email_smtp_host: smtp.mailbox.org
email_smtp_port: 465
email_smtp_port_startls: 587

# MSMTP
msmtp_accounts:
    - account: mailbox
      host: "{{ email_smtp_host }}"
      port: "{{ email_smtp_port_startls }}"
      auth: "on"
      from: "{{ email }}"
      user: "{{ email }}"
      password: "{{ email_password }}"

msmtp_default_account: "mailbox"
msmtp_alias_default: "{{ email }}"

# SSH (geerlingguy.security)
security_ssh_port: 70
security_sudoers_passwordless: ["{{ username }}"]
security_autoupdate_reboot: true
security_autoupdate_mail_to: "{{ email }}"
security_autoupdate_reboot_time: "02:00"
security_autoupdate_mail_on_error: false

# Enable/disable functionality
enable_nas_stuff: false

# Containers

enable_container_jellyfin: false
enable_container_wizarr: false
enable_container_navidrome: false
enable_container_audiomuse_ai: false
enable_container_audiobookshelf: false
enable_container_jellyseerr: false
enable_container_immich: false
enable_container_qbittorrent: false
enable_container_sonarr: false
enable_container_radarr: false
enable_container_lazylibrarian: false
enable_container_lidarr: false
enable_container_prowlarr: false
enable_container_flaresolverr: false
enable_container_unpackerr: false
enable_container_bazarr: false
enable_container_tdarr: false
enable_container_gitea: false
enable_container_grocy: false
enable_container_tandoor: false
enable_container_linkding: false
enable_container_wallabag: false
enable_container_openreader: false
enable_container_invoiceninja: false
enable_container_paperless: false
enable_container_nextcloud: false
enable_container_vaultwarden: false
enable_container_gramps: false
enable_container_wireguard: false
enable_container_homarr: false
enable_container_dashdot: false
enable_container_adguard: false
enable_container_watchtower: false
enable_container_cloudflare_ddns: false
enable_container_nginx_proxy_manager: false

# IPv6 is disabled in the kernel and shut at the firewall. nas-firewall.sh only
# filters IPv4, so setting this true leaves the v6 side unfiltered.
enable_ipv6: false

# Security
enable_crowdsec: false
enable_iptables: false
enable_fail2ban: false
security_fail2ban_enabled: false

# Container ports reachable from the internet; everything else is LAN-only.
docker_wan_ports: []

# Set to true to have fail2ban push bans to the Cloudflare firewall. Requires
# cloudflare_firewall_token (vault).
enable_cloudflare: false

# Also adds the login user to sambashare. The role itself is commented out of run.yml.
enable_samba: false

# Host driver and container toolkit, on wherever a GPU-consuming service is enabled.
# Set false on a host with no NVIDIA card: the role is skipped and the services drop
# the device_requests that a driverless Docker daemon cannot satisfy.
enable_nvidia: >-
  {{ enable_container_jellyfin | default(false)
     or enable_container_immich | default(false)
     or enable_container_tdarr | default(false)
     or enable_container_openreader | default(false) }}

# Powersaving (powertop, cpufreq)
enable_powersaving: false

# Samba
samba_server_string: "{{ hostname }}"

samba_users:
    - name: "{{ username }}"
      password: "{{ password }}"

samba_global_include: global-include.conf
samba_apple_extensions: yes
samba_mitigate_cve_2017_7494: false
samba_server_max_protocol: "SMB3"
samba_server_min_protocol: "SMB3"

samba_shares:
    - name: Trash
      guest_ok: no
      public: no
      read_only: no
      writable: yes
      owner: "{{ username }}"
      browseable: yes
      path: "{{ mergerfs_root }}"
      valid_users: "{{ username }}"
      write_list: "{{ username }}"

    - name: Downloads
      guest_ok: no
      public: no
      read_only: no
      writable: yes
      browseable: yes
      owner: "{{ username }}"
      path: "{{ mergerfs_root }}/Downloads"
      valid_users: "{{ username }}"
      write_list: "{{ username }}"

    - name: Media
      guest_ok: no
      public: no
      read_only: no
      writable: yes
      browseable: yes
      owner: "{{ username }}"
      path: "{{ mergerfs_root }}/Media"
      valid_users: "{{ username }}"
      write_list: "{{ username }}"

# Snapraid and MergerFS (gated by enable_nas_stuff, above)
mergerfs_root: /mnt/storage

cache_root: /mnt/storage_cache

disks:
    - { path: /mnt/data1, src: /dev/disk/by-label/Data1, content: true }
    - { path: /mnt/data2, src: /dev/disk/by-label/Data2, content: true }
    - { path: /mnt/data3, src: /dev/disk/by-label/Data3, content: true }

cache_disks:
    - { path: /mnt/cache1, src: /dev/disk/by-label/Cache1, content: true }
    - { path: /mnt/cache2, src: /dev/disk/by-label/Cache2, content: true }

parity_disks:
    - { path: /mnt/parity1, src: /dev/disk/by-label/Parity1, content: true }

snapraid_data_disks: "{{ disks }}"
snapraid_parity_disks: "{{ parity_disks }}"
snapraid_bin_path: /usr/bin/snapraid
snapraid_runner_email_pass: "{{ email_password }}"
snapraid_runner_email_address: "{{ email }}"
snapraid_runner_email_address_from: "{{ snapraid_runner_email_address }}"
snapraid_runner_email_address_to: "{{ snapraid_runner_email_address }}"
snapraid_runner_smtp_host: "{{ email_smtp_host }}"
snapraid_runner_smtp_port: "{{ email_smtp_port }}"
snapraid_runner_command: "python3 {{ snapraid_runner_bin }} -c {{ snapraid_runner_conf }}"

snapraid_runner_path: /opt/snapraid-runner/snapraid-runner
snapraid_runner_bin: "{{ snapraid_runner_path }}.py"
snapraid_runner_conf: "{{ snapraid_runner_path }}.conf"

snapraid_runner_cron_jobs:
  - job: "/usr/local/bin/snapraid-backup.sh"
    name: "snapraid_runner"
    weekday: "0"
    hour: "3"

# Guards against a bad mount or mass delete being committed to parity.
snapraid_runner_delete_threshold: 250
snapraid_runner_email_sendon: "error"
snapraid_runner_use_ssl: true
snapraid_content_files:
    - /var/snapraid.content

snapraid_config_excludes:
    - "*.unrecoverable"
    - /lost+found/
    - "*.!sync"
    - /tmp/
    - "/Downloads/*"

# SMART error reporting
smartd_default_mail_recipients: ["{{ email }}"]

# ---------------------------------------------------------------------------
# Container service credentials
# ---------------------------------------------------------------------------
# Left UNDEFINED here so a fresh clone fails loudly rather than deploying a known
# password. Define what you need in group_vars/<inventory>/vault.yml.
#
# Always required:
#   host                          # base domain, e.g. example.com
#   ssh_public_key                # authorised key for the login user
#   password                      # login user's password
#   email_password                # SMTP password for alerts
#
# Required by the service that uses them:
#   mysql_password                # nextcloud
#   mysql_root_password           # nextcloud
#   paperless_db_password         # paperless
#   paperless_db_root_password    # paperless
#   paperless_secret_key          # paperless; container refuses to start without it
#   immich_db_password            # immich
#   gitea_db_password             # gitea
#   gitea_db_root_password        # gitea
#   invoiceninja_db_password      # invoiceninja
#   invoiceninja_db_root_password # invoiceninja
#   invoiceninja_app_key          # invoiceninja Laravel APP_KEY
#   tandoor_postgres_password     # tandoor
#   tandoor_secret_key            # tandoor
#   openreader_auth_secret        # openreader
#   openreader_s3_access_key      # openreader embedded SeaweedFS
#   openreader_s3_secret_key      # openreader embedded SeaweedFS
#   homarr_key                    # homarr SECRET_ENCRYPTION_KEY
#   audiomuse_db_password         # audiomuse-ai
#   linkding_admin                # linkding
#   linkding_admin_password       # linkding
#   sonarr_api                    # unpackerr
#   radarr_api                    # unpackerr
#   lidarr_api                    # unpackerr
#   qbittorrent_wg_config         # block scalar; full WireGuard config
#   cloudflare_dns_token          # cloudflare-ddns
#   cloudflare_firewall_token     # fail2ban, only if enable_cloudflare
#
# The database env vars are read only when a container initialises an EMPTY data
# directory. Changing one does not re-key an existing database; it just stops the
# application logging in. Rotating for real means an ALTER USER against the running
# database.
#
# Any credential reachable from this repository's public history must never be reused.
