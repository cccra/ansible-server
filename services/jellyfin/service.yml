---
hook: true

containers:
  - proxied: true
    image: ghcr.io/linuxserver/jellyfin:latest
    networks:
      - name: media_network
    device_requests:
      - driver: nvidia
        count: -1
        capabilities:
          - gpu
    # The toolkit injects the driver libraries at create time only, never on restart.
    recreate: "{{ nvidia_driver_changed | default(false) }}"
    env:
      VERSION: latest
      # REQUIRED for NVENC/NVDEC: capabilities [gpu] alone resolves to
      # "utility,compute", which does not mount libnvidia-encode or libnvcuvid.
      # Hardware transcoding then fails even though nvidia-smi works in the container.
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - "{{ docker_dir }}/jellyfin:/config"
      - "{{ mergerfs_root }}/Media/Transcodes:/config/data/transcodes"
      - "{{ mergerfs_root }}/Media/Metadata:/metadata"
      - "{{ mergerfs_root }}/Media/Cache:/data/Cache"
      - "{{ mergerfs_root }}/Media/Movies:/data/Movies"
      - "{{ mergerfs_root }}/Media/Music:/data/Music"
      - "{{ mergerfs_root }}/Media/TV:/data/TV"
      - "{{ mergerfs_root }}/Media/Personal:/data/Personal"
