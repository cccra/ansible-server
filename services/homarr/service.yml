---
# Isolated because this Homarr has no live integrations configured -- it only serves
# links. Enabling the sonarr/radarr/qbittorrent widgets would mean joining
# media_network as well.
network:
  name: homarr_network

containers:
  - image: ghcr.io/homarr-labs/homarr:latest
    networks:
      - name: homarr_network
    env:
      SECRET_ENCRYPTION_KEY: "{{ homarr_key }}"
    volumes:
      - "{{ docker_dir }}/homarr/appdata:/appdata"
