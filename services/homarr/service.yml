---
# Isolated because this Homarr only serves links. Enabling the live
# sonarr/radarr/qbittorrent widgets would mean joining media_network as well.
network:
  name: homarr_network

containers:
  - proxied: true
    image: ghcr.io/homarr-labs/homarr:latest
    networks:
      - name: homarr_network
    env:
      SECRET_ENCRYPTION_KEY: "{{ homarr_key }}"
    volumes:
      - "{{ docker_dir }}/homarr/appdata:/appdata"
