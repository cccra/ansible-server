---
containers:
  - image: favonia/cloudflare-ddns:1
    user: "{{ guid }}:{{ guid }}"
    read_only: true
    cap_drop: [all]
    security_opts: [no-new-privileges:true]
    env:
      CLOUDFLARE_API_TOKEN: "{{ cloudflare_dns_token }}"
      DOMAINS: "{{ cloudflare_ddns_domains | join(',') }}"
      IP6_PROVIDER: none
      DETECTION_TIMEOUT: 1m
      PROXIED: "false"
