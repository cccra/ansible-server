---
containers:
  - image: nickfedor/watchtower:latest
    env:
      WATCHTOWER_SCHEDULE: "{{ watchtower_schedule }}"
      WATCHTOWER_TIMEOUT: "{{ watchtower_stop_timeout }}"
      # Stop and start each container in turn, so a slow shutdown holds only that
      # container down rather than the whole batch.
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_NOTIFICATIONS: shoutrrr
      # Not error: at that level a run that failed nothing is never reported at all.
      # The template already leaves out everything below error.
      WATCHTOWER_NOTIFICATIONS_LEVEL: info
      WATCHTOWER_NOTIFICATION_REPORT: "true"
      # Every start would otherwise mail one of its own: each self-update, reboot and
      # weekly backup.
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
      WATCHTOWER_NOTIFICATION_TEMPLATE: >-
        {{ lookup('file', playbook_dir ~ '/services/watchtower/notification.tmpl') }}
      WATCHTOWER_NOTIFICATION_URL: >-
        smtp://{{ email_login | urlencode | regex_replace('/', '%2F') }}:{{ email_password | urlencode | regex_replace('/', '%2F') }}@{{ email_smtp_host }}:{{ email_smtp_port_startls }}/?from={{ email | urlencode }}&to={{ email | urlencode }}&auth=Plain&useStartTLS=yes
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
