---
hook: true

containers:
  - proxied: true
    image: binhex/arch-qbittorrentvpn:latest
    networks:
      - name: media_network
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
    capabilities:
      - net_admin
    ports:
      - "{{ lan_address }}:8118:8118"
    env:
      WEBUI_PORT: "6017"
      VPN_ENABLED: "yes"
      VPN_PROV: custom
      VPN_CLIENT: wireguard
      ENABLE_PRIVOXY: "yes"
      # Public resolvers only: this container's default route is the tunnel, so
      # adguard's address resolves to a route out through the VPN rather than to
      # adguard_network, and every lookup would burn a timeout on it first.
      NAME_SERVERS: "1.1.1.1,1.0.0.1"
      # Must track whichever network this container is on: the VPN image drops
      # inbound traffic from anywhere outside LAN_NETWORK, so leaving app_network
      # here would cut the arrs and NPM off from the WebUI.
      LAN_NETWORK: "{{ media_network_subnet }}, {{ lan_network }}"
      UMASK: "000"
    volumes:
      # wg-quick re-sets src_valid_mark itself, which fails against the read-only
      # /proc/sys an unprivileged container gets; the shim makes that redundant write
      # a no-op so the tunnel comes up without privileged: true.
      - "{{ docker_dir }}/qbittorrent/bin/sysctl:/usr/bin/sysctl:ro"
      - "{{ docker_dir }}/qbittorrent/data:/data"
      - "{{ docker_dir }}/qbittorrent/config:/config"
      - "{{ mergerfs_root }}:/tank"
