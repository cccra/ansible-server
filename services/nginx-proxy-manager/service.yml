---
containers:
  - image: jc21/nginx-proxy-manager:latest
    # The one container that reaches every zone. Upstreams stay as container names --
    # Docker's embedded DNS resolves those over whichever network the two share.
    networks: "{{ proxied_networks | map('community.general.dict_kv', 'name') | list }}"
    ports:
      - "80:80"
      - "443:443"
      # LAN only
      - "{{ lan_address }}:81:81"
    volumes:
      - "{{ docker_dir }}/nginxproxymanager/data:/data"
      - "{{ docker_dir }}/nginxproxymanager/letsencrypt:/etc/letsencrypt"
