---
containers:
  - image: ghcr.io/haveagitgat/tdarr:latest
    networks:
      - name: app_network
    device_requests:
      - driver: nvidia
        count: -1
        capabilities:
          - gpu
    # Force a recreate when the host driver changed -- the toolkit only injects the
    # driver libraries when the container is created, never on a restart.
    recreate: "{{ nvidia_driver_changed | default(false) }}"
    log_driver: json-file
    log_opt:
      max-size: 10m
      max-file: "5"
    env:
      serverIP: 0.0.0.0
      serverPort: "8266"
      webUIPort: "8265"
      internalNode: "true"
      inContainer: "true"
      ffmpegVersion: "6"
      nodeName: MyInternalNode
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - "{{ docker_dir }}/tdarr/server:/app/server"
      - "{{ docker_dir }}/tdarr/configs:/app/configs"
      - "{{ docker_dir }}/tdarr/logs:/app/logs"
      - "{{ mergerfs_root }}/Media:/media"
      - "{{ mergerfs_root }}/Media/tdarr-transcodes:/temp"
