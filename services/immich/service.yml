---
network:
  name: immich_network

containers:
  - proxied: true
    image: ghcr.io/imagegenius/immich:latest
    networks:
      - name: immich_network
    dns_servers:
      - 1.1.1.1
      - 8.8.8.8
    device_requests:
      - driver: nvidia
        count: -1
        capabilities:
          - gpu
    # The toolkit injects the driver libraries at create time only, never on restart.
    recreate: "{{ nvidia_driver_changed | default(false) }}"
    env:
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: postgres
      DB_PASSWORD: "{{ immich_db_password }}"
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      MACHINE_LEARNING_GPU_ACCELERATION: cuda
    volumes:
      - "{{ docker_dir }}/immich/config:/config"
      - "{{ mergerfs_root }}/Immich/photos:/photos"
      - "{{ mergerfs_root }}/Nextcloud/{{ username }}/files/Photos:/import/Photos:ro"
      - "{{ mergerfs_root }}/Nextcloud/{{ username }}/files/Media:/import/Media:ro"

  - name: immich-redis
    image: "{{ redis_image }}"
    networks:
      - name: immich_network

  - name: immich-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    networks:
      - name: immich_network
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "{{ immich_db_password }}"
      POSTGRES_DB: immich
    volumes:
      - "{{ docker_dir }}/immich/db:/var/lib/postgresql/data"
