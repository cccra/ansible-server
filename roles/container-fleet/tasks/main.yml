---
# Reconciles the fleet against the enable_container_* flags before roles/container
# deploys anything: the networks, teardown of disabled services, persistent data.

- name: Get a list of services
  delegate_to: localhost
  become: false
  ansible.builtin.find:
    paths:
      - "{{ playbook_dir }}/services"
    file_type: directory
    recurse: false
  register: services

# Read rather than included, so the definitions arrive as inert text: their Jinja must
# not be resolved here, and some of it refers to facts a hook has not set yet.
# nginx-proxy-manager is left out because its definition reads the list this builds.
- name: Read every service definition
  delegate_to: localhost
  become: false
  vars:
    _paths: >-
      {{ services.files | map(attribute='path') | reject('search', '/nginx-proxy-manager$')
         | map('regex_replace', '$', '/service.yml') | sort }}
  ansible.builtin.set_fact:
    service_definitions: "{{ query('file', *_paths) | map('from_yaml') | list }}"

# A service declares the network it owns; the shared zones are the ones nobody claims.
# Read in sorted order, so a container on two of them always resolves to the same one.
- name: Work out the shared zones and the containers the proxy fronts
  become: false
  vars:
    _owned: >-
      {{ service_definitions | selectattr('network', 'defined') | map(attribute='network.name') | list }}
    _referenced: >-
      {{ service_definitions | map(attribute='containers', default=[]) | flatten
         | map(attribute='networks', default=[]) | flatten | map(attribute='name') | list }}
  ansible.builtin.set_fact:
    shared_networks: "{{ _referenced | unique | reject('in', _owned) | list }}"
    proxied_containers: >-
      {{ service_definitions | map(attribute='containers', default=[]) | flatten
         | selectattr('proxied', 'defined') | selectattr('networks', 'defined') | list }}

# The proxy resolves an upstream by container name over any network the two share, so
# one network per container is enough: the shared zone it sits on, or its own if it
# sits on none.
- name: Take each proxied container's main network
  become: false
  vars:
    _zones: "{{ item.networks | map(attribute='name') | list }}"
  ansible.builtin.set_fact:
    proxied_networks: >-
      {{ ((proxied_networks | default([]))
          + [(shared_networks | select('in', _zones) | list or _zones) | first]) | unique }}
  loop: "{{ proxied_containers }}"
  loop_control:
    label: "{{ _zones | join(',') }}"

# The private ones are created here as well as by the service that declares them, so
# NPM can join every network up front whether or not the service behind it is enabled.
- name: Create the container networks
  become: false
  community.docker.docker_network:
    name: "{{ item }}"
    ipam_config: "{{ [{'subnet': network_subnets[item]}] if item in network_subnets else omit }}"
  loop: "{{ shared_networks | union(proxied_networks) }}"

# The enable_container_* flags are the source of truth for what runs: flipping one
# off and re-running actually tears the container down.
- name: Stop and remove all the disabled containers
  become: false
  vars:
    service: "{{ item.path | basename }}"
  community.docker.docker_container:
    name: "{{ service }}"
    state: absent
  when: not lookup('vars', 'enable_container_' ~ service | replace('-', '_'), default=false)
  loop: "{{ services.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

# verbose_output is required: without it the module strips each container to a fixed
# field list that omits Labels.
- name: Find every container this playbook manages
  become: false
  community.docker.docker_host_info:
    containers: true
    containers_all: true
    containers_filters:
      label: nas-setup.service
    verbose_output: true
  register: managed_containers

- name: Stop and remove every remaining container of a disabled service
  become: false
  vars:
    service: "{{ (item.Labels | default({}))['nas-setup.service'] | default('') }}"
  community.docker.docker_container:
    name: "{{ item.Names[0] | regex_replace('^/', '') }}"
    state: absent
  when:
    - service | length > 0
    - not lookup('vars', 'enable_container_' ~ service | replace('-', '_'), default=false)
  loop: "{{ managed_containers.containers | default([]) }}"
  loop_control:
    label: "{{ item.Names[0] | regex_replace('^/', '') }}"

- name: Handle persistent data
  become: false
  when: enable_nas_stuff | default(false)
  block:
    - name: Check if the persistent data folder exists on the remote machine
      ansible.builtin.stat:
        path: "{{ docker_dir }}"
      register: persistent_data

    - name: Check if the persistent data folder is empty
      ansible.builtin.find:
        paths:
          - "{{ docker_dir }}/"
        file_type: directory
        depth: 2
      register: persistent_data_find

    - name: Create the persistent data folder on the remote machine
      become: true
      ansible.builtin.file:
        dest: "{{ docker_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "users"
        mode: "2750"
      when: not persistent_data.stat.exists

    - name: Restore the persistent data folder from the MergerFS array
      become: true
      ansible.posix.synchronize:
        src: "{{ mergerfs_root }}/docker_data/"
        dest: "{{ docker_dir }}/"
        delete: true
        recursive: true
      delegate_to: "{{ inventory_hostname }}"
      when: persistent_data_find.matched < 5 or not persistent_data.stat.exists

- name: Ensure the data folder itself is owned correctly
  become: true
  ansible.builtin.file:
    dest: "{{ docker_dir }}"
    state: directory
    owner: "{{ username }}"
    group: "users"
    mode: "2750"

# Ownership must be correct before this runs: containers that lost ownership of
# their data reach it via the world bits, and stripping those locks them out.
- name: Remove world access from the persistent data folder
  become: true
  ansible.builtin.command:
    cmd: chmod -R o-rwx {{ docker_dir }}
  when: docker_data_repair_permissions | default(false) | bool
  changed_when: true
