---
# Container-fleet lifecycle: the shared network, teardown of disabled services, and
# the persistent data directory. Engine installation lives in roles/docker; this role
# is what a `--tags containers` run needs to reconcile the fleet against the
# enable_* flags before the individual service roles run.

# Created here as well as in the individual service roles: a service role run on its
# own (--tags nextcloud) has to be able to create its own network, and NPM has to be
# able to join every network up front whether or not the service behind it is enabled.
- name: Create the container networks
  become: false
  community.docker.docker_network:
    name: "{{ item }}"
    ipam_config: "{{ [{'subnet': network_subnets[item]}] if item in network_subnets else omit }}"
  loop: "{{ proxied_networks }}"

- name: Get a list of containers
  delegate_to: localhost
  become: false
  ansible.builtin.find:
    paths:
      - "roles/containers"
    file_type: directory
    recurse: false
  register: containers

# The enable_* flags are the source of truth for what runs: flipping one off and
# re-running actually tears the container down.
# Covers containers created before the service label existed.
- name: Stop and remove all the disabled containers
  become: false
  community.docker.docker_container:
    name: "{{ item.path.split('/')[-1] }}"
    state: absent
  when: not lookup('vars', 'enable_' + item.path.split('/')[-1], default=false)
  loop: "{{ containers.files }}"
  loop_control:
    label: "{{ item.path.split('/')[-1] }}"

# verbose_output is required: without it the module strips each container to a fixed
# field list that omits Labels.
- name: Find every container this playbook manages
  become: false
  community.docker.docker_host_info:
    containers: true
    containers_all: true
    containers_filters:
      label: nas-setup.service
    verbose_output: true
  register: managed_containers

- name: Stop and remove the sidecars of disabled services
  become: false
  vars:
    service: "{{ (item.Labels | default({}))['nas-setup.service'] | default('') }}"
  community.docker.docker_container:
    name: "{{ item.Names[0] | regex_replace('^/', '') }}"
    state: absent
  when:
    - service | length > 0
    - not lookup('vars', 'enable_' + service, default=false)
  loop: "{{ managed_containers.containers | default([]) }}"
  loop_control:
    label: "{{ item.Names[0] | regex_replace('^/', '') }}"

- name: Handle persistent data
  become: false
  when: enable_nas_stuff | default(false)
  block:
    - name: Check if the persistent data folder exists on the remote machine
      ansible.builtin.stat:
        path: "{{ docker_dir }}"
      register: persistent_data

    - name: Check if the persistent data folder is empty
      ansible.builtin.find:
        paths:
          - "{{ docker_dir }}/"
        file_type: directory
        depth: 2
      register: persistent_data_find

    - name: Create the persistent data folder on the remote machine
      become: true
      ansible.builtin.file:
        dest: "{{ docker_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "users"
        mode: "2750"
      when: not persistent_data.stat.exists

    - name: Restore the persistent data folder from the MergerFS array
      become: true
      ansible.posix.synchronize:
        src: "{{ mergerfs_root }}/docker_data/"
        dest: "{{ docker_dir }}/"
        delete: true
        recursive: true
      delegate_to: "{{ inventory_hostname }}"
      when: persistent_data_find.matched < 5 or not persistent_data.stat.exists

- name: Ensure the data folder itself is owned correctly
  become: true
  ansible.builtin.file:
    dest: "{{ docker_dir }}"
    state: directory
    owner: "{{ username }}"
    group: "users"
    mode: "2750"

# Ownership must be correct before this runs: containers that lost ownership of
# their data reach it via the world bits, and stripping those locks them out.
- name: Remove world access from the persistent data folder
  become: true
  ansible.builtin.command:
    cmd: chmod -R o-rwx {{ docker_dir }}
  when: docker_data_repair_permissions | default(false) | bool
  changed_when: true
