---
- name: Make sure the nginx-proxy-manager container is created and running
  community.docker.docker_container:
    name: "nginx-proxy-manager"
    image: "jc21/nginx-proxy-manager:latest"
    pull: "{{ container_pull }}"
    # The proxy is the one container that legitimately reaches every zone, so it
    # joins all of them. Upstreams stay as container names -- Docker's embedded DNS
    # resolves those over whichever network the two containers share.
    networks: "{{ proxied_networks | map('community.general.dict_kv', 'name') | list }}"
    # Without this the module leaves the container attached to networks that have
    # been removed from the list above.
    comparisons:
      networks: strict
    restart_policy: unless-stopped
    state: 'started'
    ports:
      - "80:80"
      - "443:443"
      # LAN only
      - "{{ lan_address }}:81:81"
    volumes:
      - "{{ docker_dir }}/nginxproxymanager/data:/data"
      - "{{ docker_dir }}/nginxproxymanager/letsencrypt:/etc/letsencrypt"
