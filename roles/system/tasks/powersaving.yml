---
- name: Install the powersaving packages
  ansible.builtin.package:
    name:
      - powertop
      - "linux-tools-{{ ansible_kernel }}"
    state: present

- name: Install the systemd services
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item | basename }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Powersaving systemd reload
  loop: "{{ query('fileglob', 'files/powersaving/*.service', 'files/powersaving/*.timer') }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Start and enable the systemd services
  ansible.builtin.systemd:
    state: started
    enabled: true
    name: "{{ item }}"
  loop:
    - powertop.timer
    - cpupower-min.timer

