---
- name: List the current configs
  ansible.builtin.find:
    paths: /etc/netplan
    file_type: file
    excludes:
      - 00-ansible-managed.yaml
  register: previous_config

- name: Install the netplan config
  ansible.builtin.copy:
    content: '{{ netplan_config }}'
    dest: '/etc/netplan/00-ansible-managed.yaml'
    owner: root
    group: root
    mode: "0600"
  notify: Netplan apply

# Without `state: absent` this defaulted to `state: file`, which only asserts
# attributes -- the stale configs were never actually removed.
- name: Delete the irrelevant configs
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ previous_config['files'] }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Netplan apply
