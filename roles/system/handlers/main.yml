---
- name: Netplan apply
  ansible.builtin.command:
    cmd: netplan apply
  changed_when: true

- name: Remove default user
  ansible.builtin.user:
    name: ubuntu
    state: absent

- name: Powersaving systemd reload
  ansible.builtin.systemd:
    daemon_reload: true
    state: restarted
    enabled: true
    name: "{{ item }}"
  loop:
    - powertop
    - powertop.timer
    - cpupower-min
    - cpupower-min.timer
