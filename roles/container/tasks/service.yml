---
- name: "{{ service }} | load the definition"
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/services/{{ service }}/service.yml"
    name: svc

- name: "{{ service }} | create its private network"
  become: false
  community.docker.docker_network:
    name: "{{ svc.network.name }}"
    ipam_config: "{{ svc.network.ipam_config | default(omit) }}"
  when: svc.network is defined

# Runs before the containers so it can set facts they interpolate -- qbittorrent's
# LAN_NETWORK reads media_network's Docker-assigned subnet back this way.
- name: "{{ service }} | run its pre-deploy hook"
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/services/{{ service }}/hook.yml"
  when: svc.hook | default(false)

# Each entry in svc.containers is docker_container parameters as the module documents
# them; the conventions below are supplied underneath rather than restated per service.
- name: "{{ service }} | deploy its containers"
  become: false
  vars:
    _conventions:
      name: "{{ service }}"
      labels:
        nas-setup.service: "{{ service }}"
      pull: "{{ container_pull }}"
      state: started
      restart_policy: unless-stopped
    # Merged rather than overridden, so a service adds to these instead of replacing
    # them. Applied after the service's own keys, hence the second combine below.
    _merged:
      env: "{{ container_env_defaults | combine(item.env | default({})) }}"
      volumes: "{{ container_volume_defaults + (item.volumes | default([])) }}"
    # Without this the module's allow_more_present default leaves a container attached
    # to a network dropped from its definition, silently eroding the zone split.
    _strict: "{{ {'comparisons': {'networks': 'strict'}} if item.networks is defined else {} }}"
    # device_requests goes with it on a host without the NVIDIA stack: the daemon there
    # has no runtime to satisfy the request and refuses to create the container.
    _stripped: "{{ container_meta_keys + ([] if enable_nvidia | bool else ['device_requests']) }}"
  community.docker.docker_container: >-
    {{ _conventions | combine(item) | combine(_merged) | combine(_strict)
       | dict2items | rejectattr('key', 'in', _stripped) | items2dict }}
  loop: "{{ svc.containers }}"
  loop_control:
    label: "{{ item.name | default(service) }}"
