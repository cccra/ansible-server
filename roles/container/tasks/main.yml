---
# One implementation for every service under services/. Those directories hold data
# rather than tasks: service.yml is a list of docker_container parameter dicts.

- name: Discover the service definitions
  delegate_to: localhost
  become: false
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/services"
    file_type: directory
    recurse: false
  register: service_dirs

# Enumerated from the flags rather than the directory listing, so group_vars stays the
# register of what this playbook knows how to run; the asserts below keep the two
# honest. Hyphens are not legal in a variable name, so the flag substitutes
# underscores -- which requires that a service name never contains one.
- name: Build the service list from the enable_container_* flags
  ansible.builtin.set_fact:
    container_services: >-
      {{ query('varnames', '^enable_container_')
         | map('regex_replace', '^enable_container_', '')
         | map('replace', '_', '-') | sort }}
    defined_services: >-
      {{ service_dirs.files | map(attribute='path') | map('basename') | sort }}

# container-fleet reads a missing flag as false and tears the service down, so a
# group_vars file on the bare enable_<name> spelling would take the fleet with it.
- name: Fail on flags left over from the enable_<name> convention
  vars:
    legacy: >-
      {{ query('varnames', '^enable_(' ~ (defined_services | map('replace', '-', '_') | join('|')) ~ ')$') }}
  ansible.builtin.assert:
    that: legacy | length == 0
    fail_msg: "Rename these to enable_container_*: {{ legacy | join(', ') }}"
    quiet: true

- name: Fail if the flags and the definitions disagree
  ansible.builtin.assert:
    that: container_services == defined_services
    fail_msg: >-
      flags with no definition:
      {{ container_services | difference(defined_services) | join(', ') | default('none', true) }};
      definitions with no flag:
      {{ defined_services | difference(container_services) | join(', ') | default('none', true) }}
    quiet: true

- name: Deploy the enabled services
  ansible.builtin.include_tasks: service.yml
  loop: "{{ container_services }}"
  loop_control:
    loop_var: service
  when:
    - lookup('vars', 'enable_container_' ~ service | replace('-', '_'), default=false) | bool
    # A tag cannot select an item inside a loop, hence -e service_filter=jellyfin.
    - service_filter is not defined or service in service_filter.split(',')
