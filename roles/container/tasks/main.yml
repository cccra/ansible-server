---
# One implementation for every service under services/. Those directories hold data
# rather than tasks: service.yml is a list of docker_container parameter dicts.

- name: Discover the service definitions
  delegate_to: localhost
  become: false
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/services"
    file_type: directory
    recurse: false
  register: service_dirs

# Enumerated from the flags rather than the directory listing, so group_vars stays the
# register of what this playbook knows how to run; the check below keeps the two
# honest. Hyphens are not legal in a variable name, so the flag substitutes
# underscores -- which requires that a service name never contains one.
- name: Build the service list from the enable_container_* flags
  ansible.builtin.set_fact:
    container_services: >-
      {{ query('varnames', '^enable_container_')
         | map('regex_replace', '^enable_container_', '')
         | map('replace', '_', '-') | sort }}
    defined_services: >-
      {{ service_dirs.files | map(attribute='path') | map('basename') | sort }}

# container-fleet reads a missing flag as false and tears the service down, so a
# group_vars file on the bare enable_<name> spelling would take the fleet with it.
- name: Fail on flags left over from the enable_<name> convention
  vars:
    legacy: >-
      {{ query('varnames', '^enable_(' ~ (defined_services | map('replace', '-', '_') | join('|')) ~ ')$') }}
  ansible.builtin.assert:
    that: legacy | length == 0
    fail_msg: "Rename these to enable_container_*: {{ legacy | join(', ') }}"
    quiet: true

# Only one direction of drift is dangerous. A definition with no flag is skipped by the
# deploy loop below and torn down by container-fleet, silently, so it stays fatal. A
# flag with no definition drives nothing -- teardown iterates the directories and the
# loop below skips a falsy flag before reading anything -- so it only warns.
- name: Check the flags against the service definitions
  vars:
    # A targeted run answers only for what it was asked to deploy, so drift in an
    # unrelated service cannot block it.
    _targeted: "{{ service_filter.split(',') if service_filter is defined else defined_services }}"
    _unflagged: "{{ defined_services | difference(container_services) | intersect(_targeted) }}"
    _orphaned: "{{ container_services | difference(defined_services) }}"
  block:
    - name: Warn about flags with no service definition
      ansible.builtin.debug:
        msg: >-
          WARNING: no services/ directory for {{ _orphaned | join(', ') }}.
          The flag deploys nothing -- drop it, or add the definition.
      when: _orphaned | length > 0

    - name: Fail on service definitions with no flag
      ansible.builtin.assert:
        that: _unflagged | length == 0
        fail_msg: >-
          No enable_container_* flag for {{ _unflagged | join(', ') }}. Add
          enable_container_<name> to group_vars/all/vars.yml -- without one the service
          is never deployed and container-fleet tears it down.
        quiet: true

- name: Deploy the enabled services
  ansible.builtin.include_tasks: service.yml
  loop: "{{ container_services }}"
  loop_control:
    loop_var: service
  when:
    - lookup('vars', 'enable_container_' ~ service | replace('-', '_'), default=false) | bool
    # A tag cannot select an item inside a loop, hence -e service_filter=jellyfin.
    - service_filter is not defined or service in service_filter.split(',')
