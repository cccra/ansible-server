---
- name: Create Grocy container
  community.docker.docker_container:
    name: grocy
    image: linuxserver/grocy:latest
    pull: always
    networks:
      - name: app_network
    volumes:
      - "{{ docker_dir }}/grocy/config:/config"
    env:
      USER_UID: "1000"
      USER_GID: "1000"
    restart_policy: unless-stopped
