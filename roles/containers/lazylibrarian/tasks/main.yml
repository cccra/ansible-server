---
- name: Make sure the lazylibrarian container is created and running
  community.docker.docker_container:
    name: "lazylibrarian"
    image: "ghcr.io/linuxserver/lazylibrarian:latest"
    pull: always
    networks:
      - name: app_network
    state: 'started'
    env:
      "PUID": "{{ guid }}"
      "PGID": "{{ guid }}"
      "TZ": "{{ timezone }}"
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "{{ docker_dir }}/lazylibrarian:/config"
      - "{{ mergerfs_root }}:/tank"
    restart_policy: unless-stopped
