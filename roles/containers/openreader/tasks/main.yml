---
- name: Create an openreader network
  community.docker.docker_network:
    name: openreader_network

- name: Make sure the OpenReader Kokoro TTS container is created and running
  community.docker.docker_container:
    name: "openreader-kokoro"
    image: "ghcr.io/remsky/kokoro-fastapi-gpu:v0.5.0-cu126"
    labels: {"nas-setup.service": "openreader"}
    pull: "{{ container_pull }}"
    networks:
      - name: openreader_network
    state: 'started'
    env:
      "TZ": "{{ timezone }}"
      "USE_GPU": "true"
      "DOWNLOAD_MODEL": "true"
    device_requests:
      - driver: nvidia
        count: -1
        capabilities:
          - gpu
    # Force a recreate when the host driver changed -- the toolkit only injects the
    # driver libraries when the container is created, never on a restart.
    recreate: "{{ nvidia_driver_changed | default(false) }}"
    restart_policy: unless-stopped

- name: Create OpenReader container
  community.docker.docker_container:
    name: openreader
    image: "ghcr.io/richardr1126/openreader:latest"
    labels: {"nas-setup.service": "openreader"}
    pull: "{{ container_pull }}"
    networks:
      - name: app_network
      - name: openreader_network
    volumes:
      - "/etc/localtime:/etc/localtime"
      - "{{ docker_dir }}/openreader:/app/docstore"
      - "{{ mergerfs_root }}/Media/Books:/library:ro"
    env:
      "TZ": "{{ timezone }}"
      "BASE_URL": "https://openreader.{{ host }}"
      "AUTH_SECRET": "{{ openreader_auth_secret }}"
      "ADMIN_EMAILS": "{{ email }}"
      "S3_ENDPOINT": "http://127.0.0.1:8333"
      "S3_ACCESS_KEY_ID": "{{ openreader_s3_access_key }}"
      "S3_SECRET_ACCESS_KEY": "{{ openreader_s3_secret_key }}"
      "IMPORT_LIBRARY_DIR": "/library"
      "RUNTIME_SEED_JSON": >-
        {"version":1,
         "runtimeConfig":{"defaultTtsProvider":"kokoro"},
         "providers":[{"slug":"kokoro","displayName":"Kokoro",
                       "providerType":"custom-openai",
                       "baseUrl":"http://openreader-kokoro:8880/v1",
                       "defaultModel":"kokoro","enabled":true}]}
    restart_policy: unless-stopped
