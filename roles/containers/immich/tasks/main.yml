---
- name: Create an Immich network
  community.docker.docker_network:
    name: immich_network

- name: Make sure the Immich container is created and running
  community.docker.docker_container:
    name: "immich"
    image: ghcr.io/imagegenius/immich:latest
    networks:
      - name: immich_network
      - name: app_network
    dns_servers:
      - 1.1.1.1
      - 8.8.8.8
    pull: always
    state: 'started'
    device_requests:
      - driver: nvidia
        count: -1
        capabilities:
          - gpu
    env:
      "PUID": "{{ guid }}"
      "PGID": "{{ guid }}"
      "TZ": "{{ timezone }}"
      "DB_HOSTNAME": "immich-postgres"
      "DB_USERNAME": "postgres"
      "DB_PASSWORD": "{{ immich_db_password }}"
      "DB_DATABASE_NAME": "immich"
      "REDIS_HOSTNAME": "immich-redis"
      "MACHINE_LEARNING_GPU_ACCELERATION": "cuda"
    volumes:
      - "{{ docker_dir }}/immich/config:/config"
      # - "{{ docker_dir }}/immich/photos:/photos"
      - "{{ mergerfs_root }}/Immich/photos:/photos"
      - "{{ mergerfs_root }}/Nextcloud/{{ username }}/files/Photos:/import/Photos:ro"
      - "{{ mergerfs_root }}/Nextcloud/{{ username }}/files/Media:/import/Media:ro"
    restart_policy: unless-stopped

- name: Make sure the Immich Redis container is created and running
  community.docker.docker_container:
    name: "immich-redis"
    image: redis:latest
    networks:
      - name: immich_network
    pull: always
    restart_policy: unless-stopped

- name: Make sure the Immich Postgres container is created and running
  community.docker.docker_container:
    name: "immich-postgres"
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    networks:
      - name: immich_network
    pull: always
    env:
      "POSTGRES_USER": "postgres"
      "POSTGRES_PASSWORD": "{{ immich_db_password }}"
      "POSTGRES_DB": "immich"
    volumes:
      - "{{ docker_dir }}/immich/db:/var/lib/postgresql/data"
    restart_policy: unless-stopped
