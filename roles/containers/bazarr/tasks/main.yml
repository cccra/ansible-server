---
- name: Make sure the bazarr container is created and running
  community.docker.docker_container:
    name: "bazarr"
    image: "linuxserver/bazarr:latest"
    labels: {"nas-setup.service": "bazarr"}
    pull: "{{ container_pull }}"
    networks:
      - name: media_network
    # Networks are declarative here: the default allow_more_present would connect
    # the new network but leave the container attached to the old one.
    comparisons:
      networks: strict
    state: 'started'
    env:
      "PUID": "{{ guid }}"
      "PGID": "{{ guid }}"
      "TZ": "{{ timezone }}"
    volumes:
      - "/etc/localtime:/etc/localtime"
      - "{{ docker_dir }}/bazarr:/config"
      - "{{ mergerfs_root }}:/tank"
    restart_policy: unless-stopped
