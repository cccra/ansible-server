---
# NVIDIA driver / container-toolkit setup lives in roles/nvidia, which runs for any
# GPU-consuming service rather than only for Jellyfin.

- name: Increase max_user_watches for automatic import
  become: true
  ansible.posix.sysctl:
    name: fs.inotify.max_user_watches
    value: "3276800"
    sysctl_set: true
    state: present
    reload: true

- name: Make sure the jellyfin container is created and running
  community.docker.docker_container:
    name: "jellyfin"
    image: "ghcr.io/linuxserver/jellyfin:latest"
    labels: {"nas-setup.service": "jellyfin"}
    networks:
      - name: media_network
    # Networks are declarative here: the default allow_more_present would connect
    # the new network but leave the container attached to the old one.
    comparisons:
      networks: strict
    pull: "{{ container_pull }}"
    device_requests:
      - driver: nvidia
        count: -1
        capabilities:
          - gpu
    # Force a recreate when the host driver changed -- the toolkit only injects the
    # driver libraries when the container is created, never on a restart.
    recreate: "{{ nvidia_driver_changed | default(false) }}"
    state: 'started'
    env:
      "PUID": "{{ guid }}"
      "PGID": "{{ guid }}"
      "TZ": "{{ timezone }}"
      "VERSION": "latest"
      # REQUIRED for NVENC/NVDEC. `device_requests` with capabilities [gpu] is the
      # API equivalent of `--gpus all`, which per NVIDIA defaults to
      # "utility,compute" -- that does NOT include `video`, so libnvidia-encode and
      # libnvcuvid are never mounted and hardware transcoding fails even though
      # nvidia-smi works fine inside the container.
      "NVIDIA_DRIVER_CAPABILITIES": "all"
    volumes:
      - "{{ docker_dir }}/jellyfin:/config"
      - "{{ mergerfs_root }}/Media/Transcodes:/config/data/transcodes"
      - "{{ mergerfs_root }}/Media/Metadata:/metadata"
      - "{{ mergerfs_root }}/Media/Cache:/data/Cache"
      - "{{ mergerfs_root }}/Media/Movies:/data/Movies"
      - "{{ mergerfs_root }}/Media/Music:/data/Music"
      - "{{ mergerfs_root }}/Media/TV:/data/TV"
      - "{{ mergerfs_root }}/Media/Personal:/data/Personal"
      - "/etc/localtime:/etc/localtime:ro"
    restart_policy: unless-stopped
