---
- name: Create a vaultwarden network
  community.docker.docker_network:
    name: vaultwarden_network

- name: Make sure the Vaultwarden container is created and running
  community.docker.docker_container:
    name: 'vaultwarden'
    image: "vaultwarden/server:latest"
    labels: {"nas-setup.service": "vaultwarden"}
    networks:
      - name: vaultwarden_network
    # Networks are declarative here: the default allow_more_present would connect
    # the new network but leave the container attached to the old one.
    comparisons:
      networks: strict
    pull: "{{ container_pull }}"
    state: 'started'
    env:
      WEBSOCKET_ENABLED: "true"
      INVITATIONS_ALLOWED: "true"
      SIGNUPS_ALLOWED: "false"
      DOMAIN: "https://vaultwarden.{{ host }}"
      LOG_FILE: "/data/vaultwarden.log"
      TZ: "{{ timezone }}"
    volumes:
      - "{{ docker_dir }}/vaultwarden:/data"
    restart_policy: unless-stopped
