---
- name: Create a paperless network
  community.docker.docker_network:
    name: paperless_network

- name: Make sure the Paperless MariaDB container is created and running
  community.docker.docker_container:
    name: "paperless-mariadb"
    image: "{{ mariadb_image }}"
    labels: "{{ watchtower_exclude_labels | combine({'nas-setup.service': 'paperless'}) }}"
    networks:
      - name: paperless_network
    state: 'started'
    env:
      "TZ": "{{ timezone }}"
      "MARIADB_ROOT_PASSWORD": "{{ paperless_db_root_password }}"
      "MARIADB_DATABASE": "paperless"
      "MARIADB_USER": "paperless"
      "MARIADB_PASSWORD": "{{ paperless_db_password }}"
    volumes:
      - "{{ docker_dir }}/paperless/mariadb/mysql:/var/lib/mysql"
    restart_policy: unless-stopped

- name: Make sure the Paperless Redis container is created and running
  community.docker.docker_container:
    name: "paperless-redis"
    image: "{{ redis_image }}"
    labels: "{{ watchtower_exclude_labels | combine({'nas-setup.service': 'paperless'}) }}"
    networks:
      - name: paperless_network
    restart_policy: unless-stopped

- name: Create Paperless container
  community.docker.docker_container:
    name: paperless
    image: paperlessngx/paperless-ngx:latest
    labels: {"nas-setup.service": "paperless"}
    pull: "{{ container_pull }}"
    networks:
      - name: paperless_network
    # Networks are declarative here: the default allow_more_present would connect
    # the new network but leave the container attached to the old one.
    comparisons:
      networks: strict
    volumes:
      - "{{ docker_dir }}/paperless/config:/config"
      - "{{ docker_dir }}/paperless/data:/data"
      - '{{ mergerfs_root }}/Nextcloud/{{ username }}/files/Documents/DOCUMENTS:/consume'
    env:
      "PUID": "1000"
      "PGID": "1000"
      "PAPERLESS_CONSUMPTION_DIR": "/consume"
      "PAPERLESS_URL": "https://paperless.{{ host }}"
      "PAPERLESS_SECRET_KEY": "{{ paperless_secret_key }}"
      "PAPERLESS_DBENGINE": "mariadb"
      "PAPERLESS_DBHOST": "paperless-mariadb"
      "PAPERLESS_DBPORT": "3306"
      "PAPERLESS_DBUSER": "paperless"
      "PAPERLESS_DBPASS": "{{ paperless_db_password }}"
      "PAPERLESS_REDIS": "redis://paperless-redis:6379"
    restart_policy: unless-stopped
