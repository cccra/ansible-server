---
- name: Make sure the Prowlarr container is created and running
  community.docker.docker_container:
    name: "prowlarr"
    image: "ghcr.io/linuxserver/prowlarr:latest"
    labels: {"nas-setup.service": "prowlarr"}
    pull: "{{ container_pull }}"
    networks:
      - name: media_network
    # Networks are declarative here: the default allow_more_present would connect
    # the new network but leave the container attached to the old one.
    comparisons:
      networks: strict
    state: 'started'
    env:
      "PUID": "{{ guid }}"
      "PGID": "{{ guid }}"
      "TZ": "{{ timezone }}"
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "{{ docker_dir }}/prowlarr:/config"
    restart_policy: unless-stopped
