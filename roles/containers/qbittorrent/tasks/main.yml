---
- name: Fail early if the VPN config is missing
  ansible.builtin.fail:
    msg: >-
      qbittorrent_wg_config is not defined. Put the WireGuard config for this host in
      group_vars/<inventory>/vault.yml as a block scalar (qbittorrent_wg_config: |).
  when: qbittorrent_wg_config is not defined

- name: Install the VPN config
  ansible.builtin.copy:
    content: "{{ qbittorrent_wg_config }}"
    dest: "{{ docker_dir }}/qbittorrent/config/wireguard/wg0.conf"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0600"
  no_log: true

# The VPN image needs the subnet literally, and media_network's is whatever Docker's
# default pool assigned, so read it back rather than hardcoding it.
- name: Look up the media network
  become: false
  community.docker.docker_network_info:
    name: media_network
  register: _media_network

- name: Fail if the media network does not exist yet
  ansible.builtin.fail:
    msg: >-
      media_network does not exist. Run the container-fleet role first
      (--tags containers, or a full playbook run) so the networks are created.
  when: not _media_network.exists

- name: Record the media network subnet
  ansible.builtin.set_fact:
    media_network_subnet: >-
      {{ _media_network.network.IPAM.Config
         | map(attribute='Subnet') | select('search', '\.') | first }}

- name: Make sure the qbittorrent container is created and running
  community.docker.docker_container:
    name: "qbittorrent"
    image: "binhex/arch-qbittorrentvpn:5.1.1-1-01"
    labels: {"nas-setup.service": "qbittorrent"}
    pull: "{{ container_pull }}"
    networks:
      - name: media_network
    # Networks are declarative here: the default allow_more_present would connect
    # the new network but leave the container attached to the old one.
    comparisons:
      networks: strict
    # wg-quick sets src_valid_mark itself; unprivileged, /proc/sys is read-only and
    # the tunnel fails to come up.
    privileged: true
    sysctls:
      "net.ipv4.conf.all.src_valid_mark": "1"
    capabilities:
      - net_admin
    state: 'started'
    ports:
      - "{{ lan_address }}:8118:8118"
    env:
      "WEBUI_PORT": "6017"
      "VPN_ENABLED": "yes"
      "VPN_PROV": "custom"
      "VPN_CLIENT": "wireguard"
      "ENABLE_PRIVOXY": "yes"
      "NAME_SERVERS": "{{ ','.join(dns_nameservers) }}"
      # Must track whichever network this container is on: the VPN image drops
      # inbound traffic from anywhere outside LAN_NETWORK, so leaving app_network
      # here would cut the arrs and NPM off from the WebUI.
      "LAN_NETWORK": "{{ media_network_subnet }}, {{ lan_network }}"
      "UMASK": "000"
      "PUID": "{{ guid }}"
      "PGID": "{{ guid }}"
      "TZ": "{{ timezone }}"
    volumes:
      - "{{ docker_dir }}/qbittorrent/data:/data"
      - "{{ docker_dir }}/qbittorrent/config:/config"
      - "{{ mergerfs_root }}:/tank"
      - "/etc/localtime:/etc/localtime:ro"
    restart_policy: unless-stopped
