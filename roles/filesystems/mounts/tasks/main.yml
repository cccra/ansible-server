---
# `| default([], true)` throughout: a host's group_vars may null these disk lists out,
# and `loop` errors on None. The second argument makes default fire for falsy values
# too, not just undefined ones. A `when` cannot cover it -- the loop is expanded first.

- name: Mount the data drives
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: xfs
    state: mounted
    passno: "2"
  loop: "{{ disks | default([], true) }}"
  loop_control:
    label: "{{ item.path }}"

- name: Mount the cache drives
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: ext4
    state: mounted
    opts: defaults,discard
    passno: "2"
  loop: "{{ cache_disks | default([], true) }}"
  loop_control:
    label: "{{ item.path }}"

- name: Mount the parity drives
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: xfs
    state: mounted
    passno: "2"
  loop: "{{ parity_disks | default([], true) }}"
  loop_control:
    label: "{{ item.path }}"

- name: Mount the mergerfs array
  ansible.posix.mount:
    path: "{{ mergerfs_root }}"
    src: /mnt/data*
    opts: category.create=lfs,defaults,allow_other,moveonenospc=1,minfreespace=50G,fsname=mergerfs,uid=1000,gid=1000
    fstype: fuse.mergerfs
    state: mounted
  when: disks | default([], true) | length > 0

- name: Mount the mergerfs cache only array
  ansible.posix.mount:
    path: "{{ cache_root }}"
    src: /mnt/cache*
    opts: defaults,allow_other,fsname=mergerfs_cache,category.create=mfs
    fstype: fuse.mergerfs
    state: mounted
  when: cache_disks | default([], true) | length > 0
