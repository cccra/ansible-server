---
# Note on `| default([], true)`: these disk lists may be overridden to null/empty in
# a host's group_vars. `with_items` used to coerce None to an empty list, but `loop`
# requires a real list and errors on None. The `true` second argument makes `default`
# also fire for falsy values (None, ""), not just undefined ones.
#
# The `when` cannot guard this on its own -- `loop` is expanded before `when` is
# evaluated, and `when` then filters per item.

- name: Mount the data drives
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: xfs
    state: mounted
    passno: "2"
  loop: "{{ disks | default([], true) }}"
  loop_control:
    label: "{{ item.path }}"

- name: Mount the cache drives
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: ext4
    state: mounted
    opts: defaults,discard
    passno: "2"
  loop: "{{ cache_disks | default([], true) }}"
  loop_control:
    label: "{{ item.path }}"

- name: Mount the parity drives
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: xfs
    state: mounted
    passno: "2"
  loop: "{{ parity_disks | default([], true) }}"
  loop_control:
    label: "{{ item.path }}"

# - name: Mount the mergerfs cached array
