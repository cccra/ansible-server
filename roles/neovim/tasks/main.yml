---
- name: Install Neovim python modules
  ansible.builtin.package:
    name: python3-pynvim
    state: present

# get_url sets the mode itself, so the separate chmod task is no longer needed.
- name: Grab the latest Neovim release
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.appimage"
    dest: /usr/local/bin/nvim
    owner: root
    group: root
    mode: "0755"

- name: Clone NvChad configs  # noqa: latest[git]
  become: true
  become_user: '{{ username }}'
  ansible.builtin.git:
    repo: 'https://github.com/NvChad/NvChad'
    dest: '/home/{{ username }}/.config/nvim'
    version: HEAD
    recursive: false
    force: true

