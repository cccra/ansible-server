---
- name: Install the firewall script
  ansible.builtin.template:
    src: nas-firewall.sh.j2
    dest: /usr/local/bin/nas-firewall.sh
    owner: root
    group: root
    mode: "0750"
  notify: Reapply the firewall

- name: Install the firewall systemd unit
  ansible.builtin.copy:
    src: nas-firewall.service
    dest: /etc/systemd/system/nas-firewall.service
    owner: root
    group: root
    mode: "0644"
  notify: Reapply the firewall

- name: Enable and start the firewall
  ansible.builtin.systemd:
    name: nas-firewall.service
    state: started
    enabled: true
    daemon_reload: true

- name: Stop and disable netfilter-persistent
  ansible.builtin.systemd:
    name: netfilter-persistent
    state: stopped
    enabled: false
  failed_when: false

- name: Remove the superseded saved ruleset
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/iptables/rules.v4
    - /etc/iptables/rules.v6
