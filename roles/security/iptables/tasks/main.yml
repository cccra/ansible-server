---
- name: Install netfilters-persistent
  ansible.builtin.package:
    name: netfilter-persistent
    state: present

- name: Check if rules.v4 are auto-generated
  ansible.builtin.lineinfile:
    path: /etc/iptables/rules.v4
    regexp: "^# Generated by iptables-save.*$"
    state: absent
  register: autogenerated
  notify:
    - Remove the default rules

- name: Add a header into rules.v4
  ansible.builtin.blockinfile:
    create: true
    mode: "0644"
    block: |
      *filter
      :INPUT DROP [0:0]
      :FORWARD DROP [0:0]
      :OUTPUT ACCEPT [0:0]
    path: /etc/iptables/rules.v4

- name: Allow established and related connections
  ansible.builtin.iptables:
    chain: INPUT
    match: conntrack
    ctstate: ESTABLISHED,RELATED
    comment: Ansible managed
    jump: ACCEPT

- name: Log port scans
  ansible.builtin.iptables:
    chain: INPUT
    match: conntrack
    ctstate: NEW
    comment: Ansible managed
    jump: LOG
  when: enable_crowdsec | default(false)

- name: Allow SSH
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ security_ssh_port }}"
    ctstate: NEW,ESTABLISHED
    jump: ACCEPT
    comment: Ansible managed

- name: Allow HTTP and HTTPS
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_ports:
      - "80"
      - "443"
    jump: ACCEPT
    comment: Ansible managed
  when: enable_nginxproxymanager | default(false)

- name: Set the policy for the INPUT chain to DROP
  ansible.builtin.iptables:
    chain: INPUT
    policy: DROP

- name: Save new rules
  ansible.builtin.shell:
    cmd: set -o pipefail && iptables -t filter -S INPUT | grep "Ansible managed"
    executable: /bin/bash
  changed_when: false
  register: iptables_rules

- name: Add COMMIT
  ansible.builtin.lineinfile:
    line: COMMIT
    state: present
    path: /etc/iptables/rules.v4

- name: Save the new rules into rules.v4
  ansible.builtin.blockinfile:
    block: "{{ iptables_rules.stdout }}"
    state: present
    insertbefore: COMMIT
    path: /etc/iptables/rules.v4
    marker_begin: "CUSTOM RULES BEGIN"
    marker_end: "CUSTOM RULES END"
  notify:
    - Restart relevant services
