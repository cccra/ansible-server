---
- name: Resolve the apt repository architecture
  ansible.builtin.include_tasks: repo_arch.yml

- name: Ensure the apt keyring directory exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add the CrowdSec apt signing key
  become: true
  ansible.builtin.get_url:
    url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
    dest: /etc/apt/keyrings/crowdsec.asc
    owner: root
    group: root
    mode: "0644"

- name: Add the CrowdSec apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: crowdsec
    types: [deb]
    uris: "https://packagecloud.io/crowdsec/crowdsec/{{ ansible_facts['distribution'] | lower }}"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [main]
    architectures: ["{{ repo_arch }}"]
    signed_by: /etc/apt/keyrings/crowdsec.asc
    enabled: true
    state: present

- name: Remove the superseded CrowdSec apt source and key
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/crowdsec.list
    - /etc/apt/trusted.gpg.d/crowdsec.gpg

- name: Update apt and install CrowdSec
  become: true
  ansible.builtin.apt:
    update_cache: true
    name:
      - crowdsec
      - crowdsec-firewall-bouncer-iptables
    state: present

- name: Update the CrowdSec hub index
  become: true
  ansible.builtin.command:
    cmd: cscli hub update
  changed_when: false

# Already running under become, so the inner `sudo` was redundant.
- name: Install the necessary collections
  become: true
  ansible.builtin.command:
    cmd: "cscli collections install crowdsecurity/{{ item }}"
  loop:
    - nginx
    - sshd
    - linux
    - iptables
  register: collections_install_result
  changed_when: "'overwrite' not in collections_install_result.stderr"

- name: Increase ban time
  become: true
  ansible.builtin.replace:
    path: "/etc/crowdsec/profiles.yaml"
    regexp: 'duration: [0-9]h'
    replace: 'duration: 999h'
  notify:
    - Restart crowdsec

- name: Start and enable CrowdSec services
  become: true
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - crowdsec
    - crowdsec-firewall-bouncer
