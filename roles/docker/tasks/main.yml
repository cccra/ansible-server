---
- name: Resolve the apt repository architecture
  ansible.builtin.include_tasks: repo_arch.yml

- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['distribution'] }}.yml"

- name: Install required system packages
  ansible.builtin.package:
    state: present
    name: "{{ docker_deps }}"

- name: Install Docker (Ubuntu)
  when: ansible_facts['distribution'] == 'Ubuntu'
  become: true
  block:
    - name: Ensure the apt keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Add the Docker apt signing key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"

    - name: Add the Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [stable]
        architectures: ["{{ repo_arch }}"]
        signed_by: /etc/apt/keyrings/docker.asc
        enabled: true
        state: present
      register: docker_repo

    # The repo used to be defined as a one-line docker.list with its key in
    # trusted.gpg.d. Leaving those in place would define the repository twice.
    - name: Remove the superseded Docker apt source and key
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/docker.list
        - /etc/apt/trusted.gpg.d/docker.gpg

    - name: Switch to iptables-legacy
      community.general.alternatives:
        name: iptables
        path: /usr/sbin/iptables-legacy

    - name: Switch to ip6tables-legacy
      community.general.alternatives:
        name: ip6tables
        path: /usr/sbin/ip6tables-legacy

    - name: Switch to pip3
      community.general.alternatives:
        name: pip
        link: /usr/bin/pip
        path: /usr/bin/pip3

    - name: Switch to python3
      community.general.alternatives:
        name: python
        link: /usr/bin/python
        path: /usr/bin/python3

- name: Update apt and install Docker
  when: ansible_facts['os_family'] == 'Debian'
  ansible.builtin.apt:
    update_cache: true
    name: "{{ docker_packages }}"
    state: present

- name: Ensure group docker exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Add the deploy user to the docker group
  ansible.builtin.user:
    name: "{{ username }}"
    groups:
      - docker
    append: true
  register: docker_group_membership

# The open SSH session keeps the pre-change group list, so on a fresh host every
# later `become: false` Docker task would fail with a permission error until the
# connection is rebuilt.
- name: Reset the connection so the docker group takes effect
  ansible.builtin.meta: reset_connection
  when: docker_group_membership is changed

- name: Install the Docker module for Python
  ansible.builtin.package:
    name: python3-docker
    state: present

- name: Make sure Docker is running and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Read the existing Docker daemon configuration
  become: true
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: docker_daemon_raw
  failed_when: false
  changed_when: false

# Merged, not overwritten: roles/nvidia adds its runtime to this same file.
- name: Configure Docker log rotation
  become: true
  ansible.builtin.copy:
    content: >-
      {{ (docker_daemon_raw.content | b64decode | from_json
          if docker_daemon_raw.content is defined else {})
         | combine({'log-driver': 'json-file',
                    'log-opts': {'max-size': docker_log_max_size,
                                 'max-file': docker_log_max_file}})
         | to_nice_json }}
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart docker

# Log options apply at container creation, so the daemon must be reloaded before the
# container roles run later in this play.
- name: Flush handlers so the daemon picks up the new configuration
  ansible.builtin.meta: flush_handlers

# The shared app_network, teardown of disabled services, and the persistent data
# directory live in roles/container-fleet -- this role only installs the engine.
