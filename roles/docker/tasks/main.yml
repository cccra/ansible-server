---
- name: Resolve the apt repository architecture
  ansible.builtin.include_tasks: repo_arch.yml

- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['distribution'] }}.yml"

- name: Install required system packages
  ansible.builtin.package:
    state: present
    name: "{{ docker_deps }}"

- name: Install Docker (Ubuntu)
  when: ansible_facts['distribution'] == 'Ubuntu'
  become: true
  block:
    - name: Ensure the apt keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Add the Docker apt signing key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"

    - name: Add the Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [stable]
        architectures: ["{{ repo_arch }}"]
        signed_by: /etc/apt/keyrings/docker.asc
        enabled: true
        state: present
      register: docker_repo

    # The repo used to be defined as a one-line docker.list with its key in
    # trusted.gpg.d. Leaving those in place would define the repository twice.
    - name: Remove the superseded Docker apt source and key
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/docker.list
        - /etc/apt/trusted.gpg.d/docker.gpg

    - name: Switch to iptables-legacy
      community.general.alternatives:
        name: iptables
        path: /usr/sbin/iptables-legacy

    - name: Switch to ip6tables-legacy
      community.general.alternatives:
        name: ip6tables
        path: /usr/sbin/ip6tables-legacy

    - name: Switch to pip3
      community.general.alternatives:
        name: pip
        link: /usr/bin/pip
        path: /usr/bin/pip3

    - name: Switch to python3
      community.general.alternatives:
        name: python
        link: /usr/bin/python
        path: /usr/bin/python3

- name: Update apt and install Docker
  when: ansible_facts['os_family'] == 'Debian'
  ansible.builtin.apt:
    update_cache: true
    name: "{{ docker_packages }}"
    state: present

- name: Ensure group docker exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Add the deploy user to the docker group
  ansible.builtin.user:
    name: "{{ username }}"
    groups:
      - docker
    append: true

- name: Install the Docker module for Python
  ansible.builtin.package:
    name: python3-docker
    state: present

- name: Make sure Docker is running and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Read the existing Docker daemon configuration
  become: true
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: docker_daemon_raw
  failed_when: false
  changed_when: false

# Merged, not overwritten: roles/nvidia adds its runtime to this same file.
- name: Configure Docker log rotation
  become: true
  ansible.builtin.copy:
    content: >-
      {{ (docker_daemon_raw.content | b64decode | from_json
          if docker_daemon_raw.content is defined else {})
         | combine({'log-driver': 'json-file',
                    'log-opts': {'max-size': docker_log_max_size,
                                 'max-file': docker_log_max_file}})
         | to_nice_json }}
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart docker

# Log options apply at container creation, so the daemon must be reloaded before the
# container roles run later in this play.
- name: Flush handlers so the daemon picks up the new configuration
  ansible.builtin.meta: flush_handlers

- name: Create the shared application network
  become: false
  community.docker.docker_network:
    name: app_network
    ipam_config:
      - subnet: "{{ app_network_subnet }}"

- name: Get a list of containers
  delegate_to: localhost
  become: false
  ansible.builtin.find:
    paths:
      - "roles/containers"
    file_type: directory
    recurse: false
  register: containers

# The enable_* flags are the source of truth for what runs: flipping one off and
# re-running actually tears the container down.
# Covers containers created before the service label existed.
- name: Stop and remove all the disabled containers
  become: false
  community.docker.docker_container:
    name: "{{ item.path.split('/')[-1] }}"
    state: absent
  when: not lookup('vars', 'enable_' + item.path.split('/')[-1], default=false)
  loop: "{{ containers.files }}"
  loop_control:
    label: "{{ item.path.split('/')[-1] }}"

# verbose_output is required: without it the module strips each container to a fixed
# field list that omits Labels.
- name: Find every container this playbook manages
  become: false
  community.docker.docker_host_info:
    containers: true
    containers_all: true
    containers_filters:
      label: nas-setup.service
    verbose_output: true
  register: managed_containers

- name: Stop and remove the sidecars of disabled services
  become: false
  vars:
    service: "{{ (item.Labels | default({}))['nas-setup.service'] | default('') }}"
  community.docker.docker_container:
    name: "{{ item.Names[0] | regex_replace('^/', '') }}"
    state: absent
  when:
    - service | length > 0
    - not lookup('vars', 'enable_' + service, default=false)
  loop: "{{ managed_containers.containers | default([]) }}"
  loop_control:
    label: "{{ item.Names[0] | regex_replace('^/', '') }}"

- name: Handle persistent data
  become: false
  when: enable_nas_stuff | default(false)
  block:
    - name: Check if the persistent data folder exists on the remote machine
      ansible.builtin.stat:
        path: "{{ docker_dir }}"
      register: persistent_data

    - name: Check if the persistent data folder is empty
      ansible.builtin.find:
        paths:
          - "{{ docker_dir }}/"
        file_type: directory
        depth: 2
      register: persistent_data_find

    - name: Create the persistent data folder on the remote machine
      become: true
      ansible.builtin.file:
        dest: "{{ docker_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "users"
        mode: "2750"
      when: not persistent_data.stat.exists

    - name: Restore the persistent data folder from the MergerFS array
      become: true
      ansible.posix.synchronize:
        src: "{{ mergerfs_root }}/docker_data/"
        dest: "{{ docker_dir }}/"
        delete: true
        recursive: true
      delegate_to: "{{ inventory_hostname }}"
      when: persistent_data_find.matched < 5 or not persistent_data.stat.exists

- name: Ensure the data folder itself is owned correctly
  become: true
  ansible.builtin.file:
    dest: "{{ docker_dir }}"
    state: directory
    owner: "{{ username }}"
    group: "users"
    mode: "2750"

# Ownership must be correct before this runs: containers that lost ownership of
# their data reach it via the world bits, and stripping those locks them out.
- name: Remove world access from the persistent data folder
  become: true
  ansible.builtin.command:
    cmd: chmod -R o-rwx {{ docker_dir }}
  when: docker_data_repair_permissions | default(false) | bool
  changed_when: true
